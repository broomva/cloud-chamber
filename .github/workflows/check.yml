# Typecheck, lint, test, render gate and demo checks.
#
# Unit tests assert the physics against reference tables (NIST, PDG) but cannot compile GLSL or
# show that the picture matches the physics. The render gate does: headless Chromium on
# SwiftShader draws fixed scenarios and measures the frames (an alpha track's length against the
# NIST range, a black frame where nothing should condense). The demo check then loads the built
# page and uses its controls.
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

      # The runner is several times slower than a laptop; `bun run test` raises bun's 5 s default.
      - run: bun run test

      # The pinned playwright-core decides the browser revision.
      - run: bunx playwright-core install --with-deps chromium-headless-shell

      - run: bun run render

      # public/index.html is generated. Rebuild it and refuse a committed copy that drifted.
      - name: Demo page is current
        run: |
          bun run demo --out "$RUNNER_TEMP/index.html"
          cmp "$RUNNER_TEMP/index.html" public/index.html

      - run: bun run check-demo
